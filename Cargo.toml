[workspace]
resolver = "3"
members = ["crates/*"]
# mahere-android only compiles for Android targets (cargo ndk -p mahere-android) and mahere-ferros only for ferros (the ferros repo's tools/mahere-build.sh); host-side `cargo build/test` skips them and mahere-device, the touch-device app both run.
default-members = [
    "crates/mahere-app",
    "crates/mahere-coord",
    "crates/mahere-dem",
    "crates/mahere-engine",
    "crates/mahere-gpu",
    "crates/mahere-osm",
    "crates/mahere-panel",
    "crates/mahere-store",
    "crates/mahere-update",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickspiker/mahere"

# vsf, fluor and kete (and kete's manifestus and tohu) come from crates.io since the v10 publish (2026-10-20). Until then mahere took them from GitHub at pinned commits, with [patch] blocks redirecting their sibling path dependencies, because a git checkout has no ../vsf next to it.


# Dev builds keep line tables only: backtraces still name the file and line, and the full debug info that filled Harbor (2026-11-08) is gone.
[profile.dev]
debug = "line-tables-only"
