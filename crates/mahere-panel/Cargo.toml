[package]
name = "mahere-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere's on-map controls: a gear that shows and hides the layer toggles and readouts, painted with fluor's widgets into an overlay either renderer composites"

[dependencies]
mahere-engine = { path = "../mahere-engine" }
mahere-tiles = { path = "../mahere-tiles" }
fluor = { git = "https://github.com/nickspiker/fluor", rev = "5855711", default-features = false, features = ["std", "text", "icon"] }
vsf = { git = "https://github.com/nickspiker/vsf", rev = "a73e319fb96d8298cbb2fab4d0df1c391dee5637" }
