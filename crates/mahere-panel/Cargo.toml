[package]
name = "mahere-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere's on-map controls: a gear that shows and hides the layer toggles and readouts, painted with fluor's widgets into an overlay either renderer composites"

[dependencies]
mahere-engine = { path = "../mahere-engine" }
mahere-tiles = { path = "../mahere-tiles" }
fluor = { git = "https://github.com/nickspiker/fluor", rev = "e8bbfd43119cc510abfc85b304a583377a5a1e81", default-features = false, features = ["std", "text", "icon", "packs"] }
vsf = { git = "https://github.com/nickspiker/vsf", rev = "7b19bd1508bf20f2bd6f208cb00c0e55c76db6a1" }
