[package]
name = "mahere-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere's host-independent map core: camera, terrain reservoir engine, road rasterizer, GPS pin"

[dependencies]
mahere-coord = { path = "../mahere-coord" }
mahere-tiles = { path = "../mahere-tiles" }
rayon = "1"
rustc-hash = "2"
vsf = { version = "0.10" }

# The bucket over HTTPS. ferros (docs/STD-TARGET.md in the ferros repo) has no TLS and no std sockets: there the bucket is reached over plain HTTP through the connections Mahere's ferros shell dials over the ip server (plain_http, mahere-ferros), and ureq is not built.
[target.'cfg(not(target_os = "ferros"))'.dependencies]
ureq = "2"

# target_os = "ferros" is a device running ferros (its std target, ferros docs/STD-TARGET.md): rustc does not know the name, so the cfg is declared here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ferros"))'] }
