[package]
name = "mahere-tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere's cell pipeline: bake DEM + linework into dymaxion-cell VSF rasters (the #pagetable renderer's food)"

[dependencies]
mahere-coord = { path = "../mahere-coord" }
mahere-dem = { path = "../mahere-dem" }
mahere-osm = { path = "../mahere-osm" }
rayon = "1"
ureq = "2"
zstd = "0.13"
vsf = { path = "../../../vsf-v10", features = ["text"] }

[dev-dependencies]
png = "0.17"
