[package]
name = "mahere-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere's on-device database: session, tracks (and soon tiles) on the kete/manifestus crash-proof vault"

[dependencies]
kete = { version = "0.0.3" }
# The machine's own device secret and the session Photon leaves for the stack's apps.
tohu = { version = "0.0.3" }
# The fleet: device key, fleet key recovery and the fleet-shared state Photon's settings ride. Unpublished; built from its sibling checkout.
fgtw = { path = "../../../fgtw" }
mahere-engine = { path = "../mahere-engine" }
mahere-tiles = { path = "../mahere-tiles" }
mahere-coord = { path = "../mahere-coord" }
zstd = "0.13"
blake3 = "1"
vsf = { version = "0.10" }
rand = "0.8"
ureq = "2"
mahere-panel = { path = "../mahere-panel" }
