[package]
name = "mahere-android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere Android shell: fluor AndroidShell host + raw two-finger gesture solve + GPS JNI"

[lib]
name = "mahere_android"
crate-type = ["cdylib"]

[dependencies]
mahere-engine = { path = "../mahere-engine" }
mahere-store = { path = "../mahere-store" }
fluor = { path = "../../../fluor-var", features = ["host-android"] }
jni = "0.21"
ndk = { version = "0.9", features = ["api-level-26"] }
ndk-sys = "0.6"
libc = "0.2"
rayon = "1"
mahere-gpu = { path = "../mahere-gpu" }
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan"] }
raw-window-handle = "0.6"
pollster = "0.4"
mahere-panel = { path = "../mahere-panel" }
mahere-update = { path = "../mahere-update" }
mahere-coord = { path = "../mahere-coord" }
