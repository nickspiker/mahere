[package]
name = "mahere-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mahere's updates: signed VSF manifests per channel (release, dev) and platform, checked, downloaded and verified (after Photon's)"

[dependencies]
vsf = { version = "0.10", features = ["crypto-verify", "text-encode"] }
ed25519-dalek = "2"
blake3 = "1"

# ferros (docs/STD-TARGET.md in the ferros repo) has no TLS and no std sockets: there ureq carries no TLS (an https fetch answers that it cannot). The map's cells on a ferros device come from the vault.
[target.'cfg(not(target_os = "ferros"))'.dependencies]
ureq = "2"

[target.'cfg(target_os = "ferros")'.dependencies]
ureq = { version = "2", default-features = false }

[features]
# Writing and signing manifests: the publish tool's, not the app's (vsf's full crypto set comes with it).
publish = ["vsf/crypto"]

[[bin]]
name = "mahere-manifest"
required-features = ["publish"]

# target_os = "ferros" is a device running ferros, as a process of its kernel (a JSON target, docs/STD-TARGET.md in the ferros repo): rustc does not know the name, so the cfg is declared here.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("ferros"))'] }
