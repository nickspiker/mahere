apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'nz.mahere.app'
    compileSdk 35

    defaultConfig {
        applicationId "nz.mahere.app"
        minSdk 26
        targetSdk 35
        // The publish script passes the version from git (commit count + short hash); a local build is 1 / dev.
        def vcode = System.getenv("MAHERE_VERSION_CODE") ?: "1"
        def vname = System.getenv("MAHERE_VERSION_NAME") ?: "dev"
        versionCode vcode.toInteger()
        versionName vname
        ndk { abiFilters 'arm64-v8a' }
    }

    // Release signing comes from the keys dir via the environment (scripts/publish-android.sh); nothing secret lives in the tree. Without it a release build falls back to the debug key, which is fine for sideloading over a debug install but not for updating a published one.
    signingConfigs {
        release {
            def ks = System.getenv("MAHERE_KEYSTORE")
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv("MAHERE_KEYSTORE_PASS")
                keyAlias "mahere"
                keyPassword System.getenv("MAHERE_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("MAHERE_KEYSTORE") != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// Build the Rust cdylib and drop it into jniLibs before every build.
task cargoBuild(type: Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a',
            '-o', new File(projectDir, 'src/main/jniLibs').absolutePath,
            'build', '--release', '-p', 'mahere-android'
}
preBuild.dependsOn cargoBuild

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
